# Copy to .github/workflows/radar.yml in your PRIVATE deployment repo.
# That repo holds config/ and data/; this public repo is checked out as the engine.
name: radar
on:
  schedule:
    - cron: "17 0,6,12,18 * * *"   # 4x/day UTC, jittered minute
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test Telegram alert before the run"
        type: boolean
        default: false
concurrency:
  group: radar
  cancel-in-progress: false
permissions:
  contents: write   # commit data/
  issues: write     # "Source health" issue
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Mark job start (for minutes accounting)
        run: echo "RADAR_JOB_STARTED=$(date -u +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: zhandosayupov/job-radar   # the public engine
          ref: main
          path: engine
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - run: pip install ./engine
      - name: Test alert
        if: ${{ inputs.test_alert }}
        env:
          RADAR_TG_BOT_TOKEN: ${{ secrets.RADAR_TG_BOT_TOKEN }}
          RADAR_TG_CHAT_ID: ${{ secrets.RADAR_TG_CHAT_ID }}
        run: python -m radar.alerts --strict --text "✅ job-radar: test alert from $GITHUB_REPOSITORY run $GITHUB_RUN_NUMBER"
      - name: Run radar
        env:
          RADAR_TG_BOT_TOKEN: ${{ secrets.RADAR_TG_BOT_TOKEN }}
          RADAR_TG_CHAT_ID: ${{ secrets.RADAR_TG_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m radar.run --config config --data data --commit-msg-file "$RUNNER_TEMP/msg.txt"
      - name: Commit data
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -q -F "$RUNNER_TEMP/msg.txt"
          for i in 1 2; do
            if git pull --rebase -q && git push -q; then exit 0; fi
            echo "push failed, retry $i"; sleep 5
          done
          exit 1
      - name: Alert on failure
        if: failure()
        env:
          RADAR_TG_BOT_TOKEN: ${{ secrets.RADAR_TG_BOT_TOKEN }}
          RADAR_TG_CHAT_ID: ${{ secrets.RADAR_TG_CHAT_ID }}
        run: |
          if [ -z "$RADAR_TG_BOT_TOKEN" ] || [ -z "$RADAR_TG_CHAT_ID" ]; then echo "alerts not configured"; exit 0; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            --data-urlencode "chat_id=$RADAR_TG_CHAT_ID" \
            --data-urlencode "text=🔴 job-radar run FAILED: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "https://api.telegram.org/bot${RADAR_TG_BOT_TOKEN}/sendMessage")
          echo "telegram HTTP $code"
