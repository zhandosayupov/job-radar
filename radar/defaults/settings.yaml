# Defaults. A deployment's config/settings.yaml is deep-merged over this file
# (dicts merge; lists and scalars replace).
#
# Pattern syntax: plain entries match whole words, case-insensitive ("c++" works).
# "re:<regex>" = case-insensitive regex; "RE:<regex>" = case-sensitive regex.

budget:
  month_soft_limit: 1400     # minutes this month; above -> tier-1 sources only
  month_hard_limit: 1700     # above -> exit early with a notice
  month_included: 2000       # GitHub Free private-repo minutes (shown in the summary)
  run_time_budget_s: 480     # stop starting new sources after this many seconds

inbox:
  max_items: 150
  max_tokens: 90000          # estimate: chars / 4; keeps one labeler call under the 100K-token price step (rest waits in overflow)
  text_chars: 8000           # full description per item (`text`); 0 = excerpt only
  pending_max_age_days: 45
  detail_fetch_cap: 30       # max per-job detail pages fetched per run (all sources)

seen_months: 6

http:
  user_agent: "job-radar/0.1 (+https://github.com/zhandosayupov/job-radar)"
  min_interval_s: 1.0
  timeout_s: 20
  retries: 2

health:
  issue_after_failures: 3

# Telegram bot (secrets RADAR_TG_BOT_TOKEN / RADAR_TG_CHAT_ID). Health changes
# (broke/degraded/empty/recovered) are always sent; the run summary depends on `summary`.
alerts:
  summary: always            # always | on_new (only when something new passed the filter) | off
  summary_top: 5             # newest kept items listed in the summary

prefilter:
  title_drop:
    - intern
    - interns
    - internship
    - apprentice
    - apprenticeship
    - graduate
    - new grad
    - staff
    - principal
    - director
    - manager
    - head of
    - vp
    - vice president
    - sales
    - recruiter
    - recruiting
    - hr
    - trader
    - "re:стаж[её]р"
    - стажировка
    - руководитель
    - директор
    - менеджер
    - "re:head\\b"

  # Exceptions keyed by the title_drop entry they override.
  title_drop_except:
    trader: ["Trading Systems", "Quant Developer", "Quantitative Developer"]
    graduate: ["re:experienced", "re:all levels"]
    staff: ["Technical Staff"]

  title_require:
    - software
    - developer
    - engineer
    - engineering
    - programmer
    - quant developer
    - quantitative developer
    - platform
    - infrastructure
    - sre
    - site reliability
    - performance
    - low latency
    - low-latency
    - ml engineer
    - data engineer
    - backend
    - back-end
    - c++
    - golang
    - swe
    - technical staff
    - "RE:\\bMTS\\b"
    - "re:разработчи"
    - "re:программист"
    - "re:инженер"

  # Dropped only when the job is NOT remote-eligible (remote + allowed or unrestricted
  # region): a remote job you can do from Kazakhstan needs no visa.
  text_drop_unless_remote:
    - "re:\\bno (?:visa )?sponsorship"
    - "re:\\bno visa (?:support|assistance|help)"
    - "re:\\b(?:unable|not able|cannot|can ?not|can't|will not|won't|do not|does not|don't|doesn't|are not able|is not able) (?:to )?(?:offer |provide |support )?(?:visa |work permit |immigration )?(?:sponsor|visa assistance|visa support)"
    - "re:\\bsponsorship (?:is )?not (?:available|offered|provided)"
    - "re:без (?:визовой )?поддержки"

  # Always dropped.
  text_drop:
    - "re:must already (?:have|hold|possess) (?:the |a )?(?:legal )?(?:right|authori[sz]ation|permission) to work"
    - "re:existing right to work"
    - "re:\\bU\\.?S\\.? persons? only"
    - "re:only (?:open to )?U\\.?S\\.? (?:citizens|persons)"
    - "re:only (?:hire|consider|accept|employ) U\\.?S\\.? (?:citizens|persons)"
    - "re:security clearance"
    - "re:\\b(?:TS/SCI|SC|DV) clearance"
    - "re:гражданств\\w* (?:РФ|России|Российской)"
    - "re:только (?:для )?граждан\\w* (?:РФ|России)"
    - "re:резидент\\w* (?:РФ|России)"
    - "re:только (?:из|в|на территории) (?:РФ|России)"
    - "re:(?:located|based|reside|residing|resident) in (?:Russia|Belarus)"

  location:
    # Marks a job as remote (used with allow/deny to decide remote eligibility).
    remote:
      - remote
      - anywhere
      - worldwide
      - work from home
      - wfh
      - fully distributed
      - "re:удал[её]нн?"
      - "re:из любой точки"
    # Matching any of these keeps the job (checked first).
